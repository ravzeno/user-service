name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checkout:
    name: Checkout
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

  build:
    name: Build
    needs: checkout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public
      BETTER_AUTH_SECRET: ci-test-secret-only-not-for-production-123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run db:validate
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          if-no-files-found: error
          retention-days: 1

  lint:
    name: Linter
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public
      BETTER_AUTH_SECRET: ci-test-secret-only-not-for-production-123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint

  test:
    name: Unit test
    needs: [build, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public
      BETTER_AUTH_SECRET: ci-test-secret-only-not-for-production-123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist/
      - run: node --test tests/*.test.mjs

  notify-discord:
    name: Notify Discord
    needs: [checkout, build, lint, test]
    if: ${{ !cancelled() && (needs.checkout.result == 'failure' || needs.build.result == 'failure' || needs.lint.result == 'failure' || needs.test.result == 'success' || needs.test.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Send CI result
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CHECKOUT_RESULT: ${{ needs.checkout.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          node <<'NODE'
          const webhook = process.env.DISCORD_WEBHOOK_URL;
          if (!webhook) {
            console.log('Discord notification skipped: DISCORD_WEBHOOK_URL is unavailable.');
            process.exit(0);
          }
          const success = [process.env.CHECKOUT_RESULT, process.env.BUILD_RESULT, process.env.LINT_RESULT, process.env.TEST_RESULT].every((value) => value === 'success');
          const payload = {
            allowed_mentions: { parse: [] },
            embeds: [{
              color: success ? 0x2ecc71 : 0xe74c3c,
              fields: [{ name: 'Status', value: success ? '✅ SUCCESS' : '❌ FAIL' }],
            }],
          };
          fetch(webhook, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          }).then((response) => {
            if (!response.ok) throw new Error(`Discord returned HTTP ${response.status}`);
            console.log('Discord notification sent.');
          }).catch((error) => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE
